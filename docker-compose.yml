services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./codebase/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./codebase/backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./codebase/backend:/app
      - ./data:/app/data:ro
      - fastembed_cache:/app/models
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./codebase
      dockerfile: Dockerfile.dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./codebase:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  qdrant_data:
  fastembed_cache:
